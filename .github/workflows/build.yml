# SWAT-MODFLOW3 CI, modeled on swat-model/swatplus (.github/workflows/test.yml)
# Builds, then runs the regression on the example model in data/MiddleBosque1000
# (scripts/regress.py via ctest).

name: Build SWAT-MODFLOW3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.toolchain.compiler }} ${{ matrix.build_type }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release, Debug]
        toolchain:
          - {compiler: gcc, version: 13}
          - {compiler: intel, version: '2025.2'}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Install compiler
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Configure
        run: |
          echo "Fortran compiler: ${{ env.FC }}"
          cmake --version
          cmake -B build \
            -D CMAKE_Fortran_COMPILER=${{ env.FC }} \
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel 4

      - name: Check executable
        run: |
          ls -hl build/swatmf3-*
          file build/swatmf3-*

      - name: Regression test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Build image
        run: docker build -t swatmf3:ci --build-arg VERSION="$(git describe --tags --always)" .

      - name: --version
        run: docker run --rm swatmf3:ci --version

      - name: Regression test inside the container
        run: |
          # regress.py runs this wrapper like the executable, in a temporary copy of the model
          printf '#!/bin/sh\nexec docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/model swatmf3:ci\n' > run_in_docker.sh
          chmod +x run_in_docker.sh
          python3 scripts/regress.py ./run_in_docker.sh data/MiddleBosque1000

